<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The Keys mark at small sizes: 16, 20, 24, 32 pixels.

    The same Access Mark, opened up. At 16px the full version closes: the hole
    fills in and the slash merges with it, leaving a blue square with a smudge.
    So the hole grows, the slash thickens, and the gap between them widens -
    the shape stays the same idea while the details survive being shrunk.

    This is the ordinary reason an icon has two drawings rather than one. A
    single file scaled down is a resampled bitmap; two files tuned for their
    sizes are the same mark drawn twice.

      - tile  : inset 24, corner radius 96 (a touch tighter, so the silhouette
                still reads as square at 16px rather than as a circle)
      - hole  : radius 11% of the grid, up from 9
      - slash : stroke 56, up from 44, and moved further from the hole
  -->
  <title>Keys</title>

  <defs>
    <mask id="keyhole-small">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <circle cx="184" cy="184" r="56" fill="#000"/>
      <path d="M 208 356 L 356 208"
            fill="none" stroke="#000" stroke-width="56" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="96" ry="96"
        fill="#3d7eff" mask="url(#keyhole-small)"/>
</svg>
