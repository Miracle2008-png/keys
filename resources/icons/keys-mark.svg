<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The Keys mark: the Access Mark.

    A rounded square with a circle cut out of its upper left - a keyhole read
    abstractly. It says "key" (the product name) and "access" (what a key is
    for) without drawing either literally, which is what lets it survive being
    shrunk to 16 pixels in a taskbar.

    Chosen from three concepts. The other two were a notched letterform and a
    three-bar interlock; both lost their reading below about 24px, where this
    one stays a solid shape with one clear hole.

    Flat, not shaded. The previous mark carried a vertical gradient, which is
    one more thing to go wrong at small sizes and reads as decoration rather
    than identity - and the design brief rules gradients out.

    The slash is what gives it motion. A tile with one hole is static - it sits
    there. A stroke cutting across it on the diagonal reads as a keystroke, a
    cursor, a cut: something happening rather than something sitting. It also
    balances the composition, since the hole alone pulls the whole mark to the
    upper left.

    Everything is proportional to the 512 grid, so every rendered size is the
    same shape rather than a resampled bitmap:
      - tile   : inset 30, corner radius 102
      - hole   : centred at (37%, 37%), radius 9% of the grid
      - slash  : lower-left to upper-right, stroke 44, round caps

    Both the hole and the slash are knocked out of the tile rather than painted
    over it, so the mark is a single filled shape with real holes. That keeps it
    legible on any surface - light taskbar, dark dock, coloured installer header
    - with no halo and no assumption about what is behind it.

    Colour is the accent, #3d7eff, and stays the same in every context so the
    icon is recognisable wherever it appears.
  -->
  <title>Keys</title>

  <defs>
    <mask id="keyhole">
      <!-- White keeps the tile; black cuts through it. -->
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <circle cx="190" cy="190" r="46" fill="#000"/>

      <!-- The slash, set clear of the hole so the two never touch: a stroke
           running into the circle would close it up at small sizes and leave
           an unreadable blob. -->
      <path d="M 214 348 L 348 214"
            fill="none" stroke="#000" stroke-width="44" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect x="30" y="30" width="452" height="452" rx="102" ry="102"
        fill="#3d7eff" mask="url(#keyhole)"/>
</svg>
